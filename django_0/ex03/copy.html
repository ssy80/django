<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Skills</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main>
        <ul>
            <!-- Column 1 -->
            <li>
                <section>
                    <h2>Frontend</h2>

                    <p style="width: 80%" data-value="80">HTML5</p>
                    <progress max="100" value="80" class="html5">80%</progress>

                    <p style="width: 60%" data-value="60">CSS3</p>
                    <progress max="100" value="60" class="css3">60%</progress>

                    <p style="width: 50%" data-value="50">jQuery</p>
                    <progress max="100" value="50" class="jquery">50%</progress>
                </section>
            </li>

            <!-- Column 2 -->
            <li>
                <section>
                    <h2>Backend</h2>

                    <p style="width: 75%" data-value="75">Python</p>
                    <progress max="100" value="75" class="python">75%</progress>

                    <p style="width: 65%" data-value="65">PHP</p>
                    <progress max="100" value="65" class="php">65%</progress>

                    <p style="width: 35%" data-value="35">Node.js</p>
                    <progress max="100" value="35" class="node-js">35%</progress>
                </section>
            </li>
        </ul>
    </main>

</body>
</html>
